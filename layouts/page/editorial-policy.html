{{ define "main" }}
<article class="page">
  <header class="page-header">
    {{ partial "breadcrumbs.html" . }}
    <h1 class="page-title">{{ .Title }}</h1>
    {{ with .Params.summary }}<div class="lede"><strong>{{ . }}</strong></div>{{ end }}
  </header>

  <div class="page-body content">
    {{ .Content }}
  </div>

  {{ partial "ad-slot.html" (dict "ctx" . "slot" "page_bottom") }}
</article>
{{ end }}

{{ define "sidebar" }}{{ partial "sidebar.html" . }}{{ end }}
