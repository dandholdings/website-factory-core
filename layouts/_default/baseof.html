<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang | default "en" }}" data-theme="light">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  {{ partial "header.html" . }}

  <main class="container">
    <div class="layout">
      <div class="maincol">
        {{ block "main" . }}{{ end }}
      </div>

      <aside class="sidebar" aria-label="Sidebar">
        {{ block "sidebar" . }}
          {{ partial "sidebar.html" . }}
        {{ end }}
      </aside>
    </div>
  </main>

  {{ partial "footer.html" . }}
</body>
</html>
