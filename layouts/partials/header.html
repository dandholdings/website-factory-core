{{ $brand := .Site.Title }}
{{ with site.Data.site }}{{ with .site }}{{ with .brand }}{{ $brand = . }}{{ end }}{{ end }}{{ end }}

<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="/">{{ $brand }}</a>

    <nav class="topnav" aria-label="Primary">
      <a href="{{ "/hubs/" | relURL }}">Topics</a>
      <a href="{{ "/concept-map/" | relURL }}">Concept Map</a>
      <a href="{{ "/pages/" | relURL }}">Guides</a>
      <a href="{{ "/about/" | relURL }}">About</a>
    </nav>

    <div class="search-wrap" role="search">
      <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" type="search" placeholder="Search guides…" autocomplete="off" aria-label="Search guides" />
      <ul id="searchResults" class="search-results" role="listbox"></ul>
    </div>

    <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
      <span class="theme-icon" aria-hidden="true">◐</span>
    </button>
  </div>

  <script>
  (function(){
    var btn=document.getElementById("themeToggle");
    if(!btn)return;
    function setIcon(){
      var t=document.documentElement.getAttribute("data-theme");
      btn.setAttribute("aria-label",t==="dark"?"Switch to light mode":"Switch to dark mode");
    }
    setIcon();
    btn.addEventListener("click",function(){
      var cur=document.documentElement.getAttribute("data-theme")==="dark"?"dark":"light";
      var nxt=cur==="dark"?"light":"dark";
      document.documentElement.setAttribute("data-theme",nxt);
      try{localStorage.setItem("theme",nxt)}catch(e){}
      setIcon();
    });
  })();
  </script>

  <script>
  (function(){
    var idx=null,input=document.getElementById("searchInput"),
        results=document.getElementById("searchResults"),timer=null;

    input.addEventListener("focus",function(){
      if(idx!==null)return;idx=[];
      fetch("/index.json").then(function(r){return r.json()}).then(function(d){idx=d}).catch(function(){idx=[]});
    });

    input.addEventListener("input",function(){
      clearTimeout(timer);timer=setTimeout(search,100);
    });

    function search(){
      if(!idx||!idx.length){results.innerHTML="";return}
      var q=input.value.trim().toLowerCase();
      if(q.length<2){results.innerHTML="";return}
      var w=q.split(/\s+/);
      var m=idx.filter(function(p){
        var h=(p.t+" "+p.s+" "+p.h).toLowerCase();
        return w.every(function(x){return h.indexOf(x)!==-1});
      }).slice(0,7);
      if(!m.length){results.innerHTML='<li class="sr-empty">No results</li>';return}
      results.innerHTML=m.map(function(p){
        return '<li><a href="'+p.u+'"><strong>'+esc(p.t)+'</strong>'+(p.s?'<span>'+esc(p.s)+'</span>':'')+'</a></li>';
      }).join("");
    }

    document.addEventListener("keydown",function(e){
      if(e.key==="/"&&document.activeElement.tagName!=="INPUT"&&document.activeElement.tagName!=="TEXTAREA"){e.preventDefault();input.focus()}
      if(e.key==="Escape"){input.blur();results.innerHTML="";}
    });

    document.addEventListener("click",function(e){
      if(!e.target.closest(".search-wrap"))results.innerHTML="";
    });

    function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
  })();
  </script>
</header>
