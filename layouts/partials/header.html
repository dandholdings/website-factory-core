{{ $brand := .Site.Title }}
{{ with site.Data.site }}{{ with .site }}{{ with .brand }}{{ $brand = . }}{{ end }}{{ end }}{{ end }}

<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="/">{{ $brand }}</a>

    <nav class="topnav" aria-label="Primary">
      <a href="{{ "/hubs/" | relURL }}">Topics</a>
      <a href="{{ "/concept-map/" | relURL }}">Concept Map</a>
      <a href="{{ "/pages/" | relURL }}">Guides</a>
      <a href="{{ "/about/" | relURL }}">About</a>
    </nav>

    <div class="header-actions">
      <div class="site-search" role="search">
        <label class="search-bar" for="searchInput">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="searchInput" type="search" placeholder="Search guides…" autocomplete="off" aria-label="Search guides" />
          <kbd class="search-kbd" aria-hidden="true">/</kbd>
        </label>
        <ul id="searchResults" class="search-results" role="listbox"></ul>
      </div>

      <button
        id="themeToggle"
        class="theme-toggle"
        type="button"
        aria-label="Toggle dark mode"
        title="Toggle dark mode"
      >
        <span class="theme-icon" aria-hidden="true">◐</span>
      </button>
    </div>
  </div>

  <script>
    (function () {
      var btn = document.getElementById("themeToggle");
      if (!btn) return;
      function setIcon() {
        var t = document.documentElement.getAttribute("data-theme");
        btn.setAttribute("aria-label", t === "dark" ? "Switch to light mode" : "Switch to dark mode");
      }
      setIcon();
      btn.addEventListener("click", function () {
        var current = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
        var next = current === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        try { localStorage.setItem("theme", next); } catch (e) {}
        setIcon();
      });
    })();
  </script>

  <script>
  (function(){
    var idx=null,
        input=document.getElementById("searchInput"),
        results=document.getElementById("searchResults"),
        debounce=null;

    function load(){
      if(idx!==null)return;
      idx=[];
      fetch("/index.json").then(function(r){return r.json()}).then(function(d){idx=d}).catch(function(){idx=[]});
    }

    input.addEventListener("focus",load);

    input.addEventListener("input",function(){
      clearTimeout(debounce);
      debounce=setTimeout(doSearch,80);
    });

    function doSearch(){
      if(!idx||!idx.length){results.innerHTML="";return}
      var q=input.value.trim().toLowerCase();
      if(q.length<2){results.innerHTML="";return}
      var words=q.split(/\s+/);
      var matches=idx.filter(function(p){
        var hay=(p.t+" "+p.s+" "+p.h).toLowerCase();
        return words.every(function(w){return hay.indexOf(w)!==-1});
      }).slice(0,7);
      if(!matches.length){results.innerHTML='<li class="search-empty">No results found</li>';return}
      results.innerHTML=matches.map(function(p){
        return '<li role="option"><a href="'+p.u+'"><strong>'+esc(p.t)+'</strong>'+(p.s?'<span>'+esc(p.s)+'</span>':'')+'</a></li>';
      }).join("");
    }

    document.addEventListener("keydown",function(e){
      if(e.key==="/"&&document.activeElement.tagName!=="INPUT"&&document.activeElement.tagName!=="TEXTAREA"){e.preventDefault();input.focus()}
      if(e.key==="Escape"){input.blur();results.innerHTML="";}
    });

    document.addEventListener("click",function(e){
      if(!e.target.closest(".site-search")){results.innerHTML="";}
    });

    function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
  })();
  </script>
</header>
